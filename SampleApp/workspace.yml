name: LoomitOfferwallSampleApp

options:
  bundleIdPrefix: com.loomit
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  LoomitOfferwallSampleApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - Sources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.loomit.sampleapp
      INFOPLIST_FILE: Sources/Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    scheme:
      config: Debug
      run:
        config: Debug
      testTargets: []
      archive:
        config: Release
      profile:
        config: Release
      analyze:
        config: Debug
      launch:
        config: Debug
